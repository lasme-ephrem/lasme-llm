# Dépendances surveillées automatiquement.
#
# Pourquoi : ce dépôt redistribue des bibliothèques navigateur sous
# `chat/web/vendor/` (DOMPurify, marked, KaTeX, highlight.js, Mermaid). Une
# faille dans DOMPurify touche directement la promesse de sécurité du projet,
# puisque c'est lui qui nettoie le HTML produit par le modèle.
#
# Les mises à jour y sont groupées : une PR par écosystème plutôt qu'une
# avalanche de PR isolées.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  # Les bibliothèques du front ne sont pas gérées par npm (elles sont
  # versionnées dans `chat/web/vendor`), il n'y a donc pas d'écosystème npm
  # à surveiller ici : la mise à jour se fait à la main, en remplaçant le
  # fichier et sa licence, puis en changeant le `?v=` dans `index.html`.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
