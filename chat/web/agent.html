<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasme — Console Agent</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
.agent-shell { display: flex; flex-direction: column; height: 100vh; }
.agent-top {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border, #2a2a35);
  background: var(--bg-secondary, #17171f);
}
.agent-top h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--text, #e6e6f0); }
.agent-top a { color: var(--accent, #7c5ce7); text-decoration: none; font-size: 13px; margin-left: 8px; }
.agent-timeline {
  flex: 1; overflow-y: auto; padding: 18px 20px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.agent-composer {
  display: flex; gap: 8px; padding: 12px 16px 16px;
  border-top: 1px solid var(--border, #2a2a35);
}
.agent-composer textarea {
  flex: 1; resize: none; min-height: 52px; max-height: 200px;
  border-radius: 10px; padding: 10px 12px; font: inherit;
  background: var(--bg-primary, #101017); color: inherit;
  border: 1px solid var(--border, #2a2a35);
}
.agent-composer button, .agent-top select {
  border-radius: 10px; border: 1px solid var(--border, #2a2a35);
  background: var(--bg-secondary, #17171f); color: inherit;
  padding: 8px 14px; font: inherit; cursor: pointer;
}
.agent-composer button.primary { background: var(--accent, #7c5ce7); color: #fff; border: none; }
.agent-composer button:disabled { opacity: .5; cursor: default; }
.ev-turn {
  font-size: 11px; letter-spacing: .4px; text-transform: uppercase;
  color: var(--muted, #8b8b9e); margin-top: 6px;
}
.ev-reasoning, .ev-tool {
  border: 1px solid var(--border, #2a2a35); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; background: var(--bg-primary, #101017);
}
.ev-reasoning summary, .ev-tool summary { cursor: pointer; color: var(--muted, #8b8b9e); }
.ev-reasoning pre, .ev-tool pre {
  white-space: pre-wrap; word-break: break-word; margin: 8px 0 0;
  font-size: 12px; color: var(--text, #dcdce4);
}
.ev-tool.ok summary { color: #34d399; }
.ev-tool.ko summary { color: #f87171; }
.ev-tool .meta { float: right; font-size: 11px; color: var(--muted, #8b8b9e); }
.ev-final {
  border-radius: 12px; padding: 14px 16px; line-height: 1.55;
  background: var(--bg-secondary, #17171f); border: 1px solid var(--border, #2a2a35);
  color: var(--text, #e6e6f0);
}
.ev-error { color: #f87171; font-size: 13px; }
.agent-metrics { font-size: 11.5px; color: var(--muted, #8b8b9e); padding: 0 4px; }
.user-msg {
  align-self: flex-end; max-width: 78%; border-radius: 12px;
  padding: 10px 14px; background: var(--accent, #7c5ce7); color: #fff;
  white-space: pre-wrap; word-break: break-word;
}
.user-msg, .ev-final { font-size: 14.5px; }
</style>
</head>
<body>
<div class="agent-shell">
  <header class="agent-top">
    <h1>Lasme Agent</h1>
    <select id="agent-model" title="Modèle"></select>
    <select id="agent-turns" title="Tours maximum">
      <option value="4">4 tours</option>
      <option value="8" selected>8 tours</option>
      <option value="12">12 tours</option>
      <option value="16">16 tours</option>
    </select>
    <a href="/">← Chat</a>
  </header>
  <main class="agent-timeline" id="timeline"></main>
  <div class="agent-metrics" id="metrics"></div>
  <form class="agent-composer" id="composer">
    <textarea id="prompt" placeholder="Donne une mission à l'agent… (Entrée pour envoyer)" rows="2"></textarea>
    <button type="button" id="stop" hidden>Arrêter</button>
    <button type="submit" class="primary" id="send">Envoyer</button>
  </form>
</div>
<script type="module" src="/agent.js"></script>
</body>
</html>
