<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lasme LLM">
  <!-- Marque « Bloc » : le L gravé dans la masse.
       Pastille pleine et non un simple trait : un favicon s'affiche sur une
       barre d'onglets claire COMME sombre, et un dessin pensé pour 48 px
       devient une tache à 16 px. Ici le contraste est porté par la pastille. -->
  <style>
    .tile { fill: #12241C; }
    .mark { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #E1EBE4; }
      .mark { fill: #12241C; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <path class="mark" fill-rule="evenodd"
        d="M8.9 5.5h14.2a3.4 3.4 0 0 1 3.4 3.4v14.2a3.4 3.4 0 0 1-3.4 3.4H8.9a3.4 3.4 0 0 1-3.4-3.4V8.9a3.4 3.4 0 0 1 3.4-3.4zM10.2 10.2h3.4v8.2h8.2v3.4H10.2z"/>
</svg>
