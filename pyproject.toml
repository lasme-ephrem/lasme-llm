[project]
name = "lasme-llm"
version = "1.0.0"
description = "Local multimodal AI workspace powered by Ollama"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    "app",
    "pylearn",
    "python_academy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
